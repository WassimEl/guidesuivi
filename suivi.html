<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi de commande · GGBUILD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#171716;--panel:#1F1F1E;--line:#363635;--tx:#EDEDEC;--mut:#A3A3A0;--acc:#7C4DE8;--acc2:#B9A0FA;--ok:#6FD3A0;--bad:#F08A8A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Manrope,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 18px 40px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:22px}.brand img{height:50px;width:auto;display:block}
.brand h1{margin:0;font-size:22px;font-weight:800}.brand small{color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.row{display:flex;gap:10px}.pf{flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.pf span{padding-left:12px;font-weight:600;color:var(--acc2);white-space:nowrap}
.pf input{flex:1;min-width:0;background:transparent;border:0;color:var(--tx);font:inherit;padding:12px 10px 12px 2px}
.pf:focus-within{outline:2px solid var(--acc2);outline-offset:1px}.pf input:focus{outline:0}
button{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:0 20px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.hint{margin:10px 0 0;font-size:13px;color:var(--mut)}
#out{margin-top:18px}
.msg{padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}.msg.err{border-color:#5a3232;color:var(--bad)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.num{font-weight:800;font-size:20px;color:var(--acc2)}.since{font-size:13px;color:var(--mut)}
.now{font-size:18px;font-weight:800;margin:4px 0 2px}.desc{color:var(--mut);margin:0 0 18px}
ol{list-style:none;margin:0;padding:0}
li{position:relative;padding:0 0 16px 38px;color:var(--mut)}
li::before{content:"";position:absolute;left:11px;top:24px;bottom:-2px;width:2px;background:var(--line)}li:last-child::before{display:none}
li i{position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
li.done{color:var(--tx)}li.done i{background:var(--acc);border-color:var(--acc);color:#fff}li.done::before{background:var(--acc)}
li.cur{color:var(--tx);font-weight:800}li.cur i{border-color:var(--acc2);color:var(--acc2);box-shadow:0 0 0 4px rgba(124,77,232,.25)}
.demo{margin:0 0 14px;padding:8px 12px;border-radius:8px;background:#2a2438;color:var(--acc2);font-size:13px}
.foot{margin-top:22px;font-size:13px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<main>
 <div class="brand"><img id="lg" alt="Logo GGBUILD"><div><h1>Suivi de commande</h1><small>GGBUILD · PC sur mesure</small></div></div>
 <div id="demo" class="demo" hidden>Mode démonstration : essaie 26-01, 26-02 ou 26-03. Renseigne CSV_URL dans le fichier pour afficher tes vraies commandes.</div>
 <section class="card">
  <label for="n">Numéro de commande (indiqué sur ton devis)</label>
  <div class="row">
   <div class="pf"><span>GBCMD-</span><input id="n" placeholder="26-04" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
   <button id="go">Suivre</button>
  </div>
  <p class="hint">Tu ne trouves pas ton numéro ? Il figure en haut de ton devis.</p>
 </section>
 <div id="out" role="status" aria-live="polite"></div>
 <p class="foot" id="contact"></p>
</main>

const STEPS=[
 ["Demande reçue","Nous avons bien reçu ta demande et préparons ton devis."],
 ["Devis envoyé","Ton devis t'a été envoyé. Dis-nous si la configuration te convient."],
 ["Commande validée","Ta commande est confirmée, merci pour ta confiance."],
 ["Pièces commandées","Les composants sont commandés chez nos fournisseurs."],
 ["Montage","Ton PC est en cours de montage."],
 ["Tests","Ton PC passe ses tests de stabilité et de températures."],
 ["Prêt à récupérer","Ton PC est prêt ! Nous te contactons pour la remise."],
 ["Livré","Ton PC t'a été remis. Bon jeu !"]];
const KEYS={nouveau:0,"devis envoye":1,accepte:2,"pieces commandees":3,"en montage":4,"tests en cours":5,pret:6,livre:7};
const $=s=>document.querySelector(s);
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function csv(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch==='"')q=true;else if(ch===","){row.push(c);c=""}
 else if(ch==="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!=="\r")c+=ch}
 if(c||row.length){row.push(c);r.push(row)}return r}
const DEMO="N° commande,Statut,Reçu le\nGBCMD-26-01,Nouveau,06/10/26 - 13:47\nGBCMD-26-02,En montage,06/10/26 - 13:55\nGBCMD-26-03,Prêt,06/10/26 - 23:29";
async function load(){
 let t=DEMO;
 if(CSV_URL){const r=await fetch(CSV_URL+(CSV_URL.includes("?")?"&":"?")+"t="+Date.now());if(!r.ok)throw new Error("http");t=await r.text()}
 const rows=csv(t),h=rows.shift().map(norm);
 const ci=h.findIndex(x=>x.startsWith("n")&&x.includes("commande")),si=h.indexOf("statut"),di=h.findIndex(x=>x.startsWith("recu"));
 return rows.map(r=>({n:(r[ci]||"").trim().toUpperCase(),s:r[si]||"",d:r[di]||""}));
}
function show(o,html,err){const e=$("#out");e.innerHTML=err?`<div class="msg err">${html}</div>`:html}
async function find(){
 const v=$("#n").value.trim().toUpperCase().replace(/\s+/g,"").replace(/^GBCMD-?/,"");
 if(!v){show(0,"Entre ton numéro de commande, par exemple 26-04.",1);return}
 const id="GBCMD-"+v;show(0,'<div class="msg">Recherche en cours…</div>');
 let list;try{list=await load()}catch(e){show(0,"Impossible de charger le suivi pour le moment. Réessaie dans quelques instants.",1);return}
 const o=list.find(x=>x.n===id);
 if(!o){show(0,"Aucune commande trouvée avec le numéro <b>"+esc(id)+"</b>. Vérifie le numéro indiqué sur ton devis.",1);return}
 const k=norm(o.s);
 if(k==="refuse"){show(0,'<div class="card"><div class="head"><span class="num">'+esc(id)+'</span></div><p class="now">Demande clôturée</p><p class="desc">Cette demande n\'a pas abouti. Contacte GGBUILD si tu souhaites la rouvrir.</p></div>');return}
 const cur=k in KEYS?KEYS[k]:0;
 show(0,'<div class="card"><div class="head"><span class="num">'+esc(id)+'</span>'+(o.d?'<span class="since">Reçue le '+esc(o.d)+'</span>':'')+'</div>'+
  '<p class="now">'+STEPS[cur][0]+'</p><p class="desc">'+STEPS[cur][1]+'</p><ol>'+
  STEPS.map((s,i)=>`<li class="${i<cur?"done":i===cur?"cur":""}"><i>${i<cur?"✓":i+1}</i>${s[0]}</li>`).join("")+'</ol></div>');
}
$("#go").onclick=find;$("#n").addEventListener("keydown",e=>{if(e.key==="Enter")find()});
$("#lg").src=LOGO;$("#contact").textContent=CONTACT;$("#demo").hidden=!!CSV_URL;
</script>
